<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>第一阶段 · 巡检接口测试</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172b43;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:36px auto;padding:0 24px}h1{margin-bottom:4px}h2{font-size:20px;margin-top:0}.sub{color:#52677d}section{background:white;border:1px solid #dce3ec;border-radius:12px;padding:24px;margin:20px 0}label{display:block;margin:12px 0 5px}input,textarea,select,button{font:inherit}input,textarea,select{border:1px solid #a9b8c8;border-radius:6px;padding:8px;width:100%}textarea{min-height:84px}button{background:#175fc2;color:white;border:0;border-radius:6px;padding:9px 17px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.row{display:flex;gap:12px;flex-wrap:wrap}.row>label{flex:1;min-width:120px}.actions{display:flex;gap:12px;margin-top:18px;flex-wrap:wrap}#message{padding:12px;border-radius:6px;background:#e7edf4;white-space:pre-wrap}#message[data-error=true]{background:#ffe6e3;color:#9d1b13}table{border-collapse:collapse;width:100%;text-align:left}th,td{border-bottom:1px solid #ddd;padding:12px 8px;vertical-align:top}td small{display:block;color:#5a6e84;word-break:break-all}pre{background:#14283e;color:#e2edfa;padding:16px;overflow:auto;max-height:300px} .tablewrap{overflow-x:auto}summary{cursor:pointer}code{font-family:monospace}
</style>
<main>
<p class="sub">阶段 1 / Go + SQLite</p><h1>巡检接口测试</h1>
<p class="sub">这是后端附带的测试工具，React 管理端将在后续阶段实现。这里的操作会写入真实测试数据库。</p>
<div id="message" role="status" aria-live="polite">正在连接后端…</div>
<section><h2>1. 新增一条问题</h2>
<form id="form" novalidate>
<label for="title">标题</label><input id="title" value="1 号机柜温度异常">
<label for="description">描述（可选）</label><textarea id="description">机柜右侧温度明显偏高</textarea>
<div class="row"><label>优先级<select id="priority"><option value="low">low · 低</option><option value="medium">medium · 中</option><option value="high" selected>high · 高</option></select></label>
<label>X<input id="x" type="number" step="any" value="1.25"></label><label>Y<input id="y" type="number" step="any" value="0.8"></label><label>Z<input id="z" type="number" step="any" value="2.4"></label></div>
<div class="actions"><button id="submit">提交问题</button><button type="button" id="refresh">刷新列表</button><button type="button" id="health">检查服务</button></div>
</form></section>
<section><h2>2. 已保存的问题</h2><p id="count">尚未加载</p><div class="tablewrap"><table><thead><tr><th>标题 / ID</th><th>优先级</th><th>坐标</th><th>状态</th></tr></thead><tbody id="items"></tbody></table></div></section>
<section><h2>3. 参数错误测试</h2><p>这些按钮故意发送不合法数据。预期返回 HTTP 400，列表不增加记录。</p><div class="actions"><button id="badTitle">空白标题</button><button id="badPriority">错误优先级</button><button id="badPosition">缺少 Z 坐标</button><button id="badStatus">错误状态</button></div>
<details><summary>最近一次接口响应</summary><pre id="response">暂无</pre></details></section>
<p class="sub">持久化检查：记录一条 ID → 在服务终端按 Ctrl+C → 重新运行启动脚本 → 刷新列表并核对相同 ID 和状态。</p>
</main>
<script>
const $=id=>document.getElementById(id);let issues=[];
function message(text,error=false){$('message').textContent=text;$('message').dataset.error=error;}
async function request(path,method='GET',body){
 const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),8000);
 try{const res=await fetch(path,{method,headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined,signal:controller.signal});const data=await res.json();$('response').textContent=`${method} ${path}\nHTTP ${res.status}\n`+JSON.stringify(data,null,2);if(!res.ok)throw new Error(`HTTP ${res.status}: ${data.error?.message||'请求失败'}`);return data;}
 catch(e){if(e.name==='AbortError')throw new Error('请求超时，结果尚未确认，请检查服务并刷新列表。');if(e instanceof TypeError)throw new Error('无法连接后端，请启动 Go 服务后重试。');throw e;}finally{clearTimeout(timer);}
}
async function run(button,work){button.disabled=true;try{await work();}catch(e){message(e.message,true);}finally{button.disabled=false;}}
function payload(){return{title:$('title').value,description:$('description').value,priority:$('priority').value,position:{x:$('x').value===''?null:Number($('x').value),y:$('y').value===''?null:Number($('y').value),z:$('z').value===''?null:Number($('z').value)}};}
async function load(){const data=await request('/api/issues');issues=data.items;$('items').replaceChildren();$('count').textContent=issues.length?`共 ${issues.length} 条问题`:'暂无问题，请先提交一条。';
 for(const i of issues){const tr=document.createElement('tr');const title=document.createElement('td');title.textContent=i.title;const small=document.createElement('small');small.textContent=i.id;title.append(small);tr.append(title);
 for(const text of [i.priority,`${i.position.x}, ${i.position.y}, ${i.position.z}`]){const td=document.createElement('td');td.textContent=text;tr.append(td);}
 const td=document.createElement('td'),select=document.createElement('select');select.setAttribute('aria-label',i.title+'的状态');for(const value of ['open','in_progress','resolved']){const opt=document.createElement('option');opt.value=value;opt.textContent=value;select.append(opt);}select.value=i.status;
 select.onchange=()=>run(select,async()=>{const previous=i.status;try{const updated=await request('/api/issues/'+encodeURIComponent(i.id)+'/status','PATCH',{status:select.value});i.status=updated.status;message('状态已保存：'+updated.status);}catch(e){select.value=previous;throw e;}});td.append(select);tr.append(td);$('items').append(tr);}}
$('form').onsubmit=e=>{e.preventDefault();run($('submit'),async()=>{const saved=await request('/api/issues','POST',payload());message('保存成功，ID：'+saved.id);try{await load();}catch(e){message('问题已保存，但列表刷新失败：'+e.message,true);}});};
$('refresh').onclick=()=>run($('refresh'),async()=>{await load();message('列表已刷新。');});
$('health').onclick=()=>run($('health'),async()=>{await request('/api/health');message('服务和数据库正常。');});
for(const [id,mutate] of [['badTitle',p=>p.title='   '],['badPriority',p=>p.priority='urgent'],['badPosition',p=>delete p.position.z]]){$(id).onclick=()=>run($(id),async()=>{const p={title:'参数测试',description:'',priority:'medium',position:{x:0,y:0,z:0}};mutate(p);await request('/api/issues','POST',p);message('异常：非法参数被接受。',true);});}
$('badStatus').onclick=()=>run($('badStatus'),async()=>{if(!issues.length)throw new Error('请先新增一条问题，再测试错误状态。');await request('/api/issues/'+encodeURIComponent(issues[0].id)+'/status','PATCH',{status:'closed'});message('异常：非法状态被接受。',true);});
load().then(()=>message('后端已连接，可以开始测试。')).catch(e=>message(e.message,true));
</script></html>
